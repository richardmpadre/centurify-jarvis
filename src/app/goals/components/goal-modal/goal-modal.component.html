<div class="modal-overlay" (click)="onClose()"></div>
<div class="modal goal-modal">
  <div class="modal-header">
    <h3>{{ getModalTitle() }}</h3>
    <button class="close-btn" (click)="onClose()">×</button>
  </div>
  
  <form [formGroup]="goalForm" (ngSubmit)="onSubmit()" class="modal-content">
    <!-- Title -->
    <div class="form-group">
      <label>Title <span class="required">*</span></label>
      <input 
        type="text" 
        formControlName="title" 
        placeholder="What do you want to achieve?">
    </div>

    <!-- Description -->
    <div class="form-group">
      <label>Description</label>
      <textarea 
        formControlName="description" 
        placeholder="Describe this goal in more detail..."
        rows="3"></textarea>
    </div>

    <!-- Goal Type (only for Life Purpose and Life Goals) -->
    <div class="form-group" *ngIf="!isSubGoal() && availableTypes.length > 1">
      <label>Goal Type</label>
      <select formControlName="goalType">
        <option *ngFor="let type of availableTypes" [value]="type">
          {{ getTypeConfig(type).icon }} {{ getTypeConfig(type).label }}
        </option>
      </select>
    </div>

    <!-- Status (only when editing) -->
    <div class="form-group" *ngIf="editingGoal">
      <label>Status</label>
      <select formControlName="status">
        <option *ngFor="let status of statusOptions" [value]="status">
          {{ getStatusConfig(status).label }}
        </option>
      </select>
    </div>

    <!-- Progress (only when editing) -->
    <div class="form-group" *ngIf="editingGoal">
      <label>Progress: {{ goalForm.value.progress }}%</label>
      <input 
        type="range" 
        formControlName="progress" 
        min="0" 
        max="100" 
        step="5">
    </div>

    <!-- Target Date (single field) -->
    <div class="form-group">
      <label>Target Date</label>
      <input type="date" formControlName="targetDate">
    </div>

    <!-- Daily Action Toggle (only for yearly goals) -->
    <div class="form-group checkbox-group" *ngIf="isYearlyGoal()">
      <label class="checkbox-label">
        <input type="checkbox" formControlName="requiresDailyAction">
        <span class="checkbox-text">Requires daily action</span>
      </label>
      <p class="field-hint">When enabled, you'll be prompted daily to select an ad-hoc goal to prioritize.</p>
    </div>

    <!-- Recurring Goal Toggle (for ad-hoc goals) -->
    <div class="form-group checkbox-group" *ngIf="goalForm.value.goalType === 'ad_hoc'">
      <label class="checkbox-label">
        <input type="checkbox" formControlName="isRecurring">
        <span class="checkbox-text">Daily recurring goal</span>
      </label>
      <p class="field-hint">Creates a daily action that repeats every day (e.g., track nutrition, exercise).</p>
    </div>

    <!-- Goal Category (only for recurring goals) -->
    <div class="form-group" *ngIf="isRecurringGoal()">
      <label>Category</label>
      <select formControlName="goalCategory">
        <option *ngFor="let category of categoryOptions" [value]="category">
          {{ getCategoryConfig(category).icon }} {{ getCategoryConfig(category).label }}
        </option>
      </select>
      <p class="field-hint">Determines which panel opens when you click this action.</p>
    </div>

    <!-- Nutrition Targets (only for nutrition category) -->
    <div class="nutrition-targets" *ngIf="isRecurringGoal() && isNutritionCategory()">
      <div class="form-group">
        <label>Calories</label>
        <input 
          type="number" 
          formControlName="targetCalories" 
          placeholder="2000"
          min="1000"
          max="10000">
      </div>
      <div class="form-group">
        <label>Protein (g)</label>
        <input 
          type="number" 
          formControlName="targetProtein" 
          placeholder="150"
          min="50"
          max="500">
      </div>
      <div class="form-group">
        <label>Carbs (g)</label>
        <input 
          type="number" 
          formControlName="targetCarbs" 
          placeholder="200"
          min="50"
          max="600">
      </div>
      <div class="form-group">
        <label>Fats (g)</label>
        <input 
          type="number" 
          formControlName="targetFats" 
          placeholder="65"
          min="20"
          max="200">
      </div>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button type="button" class="cancel-btn" (click)="onClose()">Cancel</button>
      <button type="submit" class="save-btn" [disabled]="goalForm.invalid">
        {{ editingGoal ? 'Save Changes' : 'Create Goal' }}
      </button>
    </div>
  </form>
</div>
