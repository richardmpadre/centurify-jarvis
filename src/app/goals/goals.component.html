<div class="goals-page">
  <!-- Life Purpose Banner -->
  <div class="life-purpose-banner" *ngIf="!isLoading && goalTree">
    <div class="purpose-content">
      <span class="purpose-icon">⭐</span>
      <div class="purpose-text">
        <span class="purpose-title">{{ goalTree.title }}</span>
        <span class="purpose-description" *ngIf="goalTree.description">{{ goalTree.description }}</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="add-life-goal-btn" (click)="onAddLifeGoal()" title="Add new life pillar">
        + New Life Pillar
      </button>
    </div>
  </div>

  <!-- Set Life Purpose Button -->
  <div class="set-purpose-container" *ngIf="!hasLifePurpose()">
    <button class="add-purpose-btn" (click)="openAddLifePurpose()">
      ⭐ Set Life Purpose
    </button>
  </div>

  <!-- Life Goal Selector Tabs -->
  <div class="life-goal-selector" *ngIf="!isLoading && lifeGoals.length > 0">
    <div class="goal-tabs">
      <button 
        *ngFor="let lifeGoal of lifeGoals"
        class="goal-tab"
        [class.active]="selectedLifeGoalId === lifeGoal.id"
        (click)="selectLifeGoal(lifeGoal.id)">
        {{ lifeGoal.title }}
      </button>
    </div>
  </div>

  <!-- Loading State -->
  <div class="loading-state" *ngIf="isLoading">
    <div class="loading-spinner"></div>
    <p>Loading goals...</p>
  </div>

  <!-- Error State -->
  <div class="error-state" *ngIf="error && !isLoading">
    <p>{{ error }}</p>
    <button class="retry-btn" (click)="loadGoals()">Retry</button>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!isLoading && !error && !hasLifePurpose()">
    <div class="empty-icon">🎯</div>
    <h3>Start Your Journey</h3>
    <p>Define your life purpose to begin building your goal hierarchy.</p>
    <button class="add-purpose-btn large" (click)="openAddLifePurpose()">
      ⭐ Set Life Purpose
    </button>
  </div>

  <!-- Goals Tree -->
  <div class="goals-tree" *ngIf="!isLoading && !error && getFilteredGoalTree().length > 0">
    <app-goal-tree-node
      *ngFor="let goal of getFilteredGoalTree()"
      [goal]="goal"
      [level]="0"
      [isExpanded]="isExpanded(goal.id)"
      [expandedGoals]="expandedGoals"
      (toggleExpand)="toggleExpand($event)"
      (addChild)="onAddChild($event)"
      (editGoal)="onEditGoal($event)"
      (deleteGoal)="onDeleteGoal($event)"
      (progressUpdate)="onProgressUpdate($event)"
      (toggleMilestone)="onToggleMilestone($event)">
    </app-goal-tree-node>
  </div>

  <!-- Empty state for when no sub-goals exist -->
  <div class="no-subgoals-state" *ngIf="!isLoading && !error && lifeGoals.length > 0 && getFilteredGoalTree().length === 0">
    <div class="empty-icon">📋</div>
    <p>No goals yet under {{ getSelectedLifeGoal()?.title }}.</p>
    <button class="add-child-btn" (click)="onAddChild(getSelectedLifeGoal()!)">
      + Add Goal
    </button>
  </div>
</div>

<!-- Goal Modal -->
<app-goal-modal
  *ngIf="showModal"
  [editingGoal]="editingGoal"
  [parentGoal]="parentGoalForNew"
  (close)="closeModal()"
  (save)="onSaveGoal($event)">
</app-goal-modal>
